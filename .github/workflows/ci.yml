name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Build backend
        run: go build ./...
        working-directory: backend

      - name: Build frontend
        run: go build ./...
        working-directory: frontend

      - name: Test frontend
        run: go test ./...
        working-directory: frontend

      - name: Lint backend
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: backend

      - name: Lint frontend
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: frontend


  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'


  availability-test:
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Deploy test version
        run: kubectl --kubeconfig kubeconfig apply -f k8s-test/

      - name: Wait for test deployment
        run: |
          kubectl --kubeconfig kubeconfig rollout status deployment/fortune-backend-test --timeout=120s
          kubectl --kubeconfig kubeconfig rollout status deployment/fortune-frontend-test --timeout=120s

      - name: Test application availability
        run: |
          kubectl --kubeconfig kubeconfig port-forward service/frontend-test 8080:8080 &
          sleep 5
          ./test-availability.sh http://localhost:8080

      - name: Clean up test deployment
        if: always()
        run: kubectl --kubeconfig kubeconfig delete -f k8s-test/ --ignore-not-found


  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Deploy to Kubernetes
        run: kubectl --kubeconfig kubeconfig apply -f k8s/