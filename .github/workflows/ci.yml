name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - name: Build backend
        run: go build ./...
        working-directory: backend

      - name: Build frontend
        run: go build ./...
        working-directory: frontend

      - name: Test frontend
        run: go test ./...
        working-directory: frontend