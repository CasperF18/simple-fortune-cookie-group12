apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortune-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortune-frontend
  template:
    metadata:
      labels:
        app: fortune-frontend
    spec:
      containers:
        - name: frontend
          image: peterf18/fortune-frontend:v1
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_DNS
              value: backend
            - name: BACKEND_PORT
              value: "9000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: fortune-frontend
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort